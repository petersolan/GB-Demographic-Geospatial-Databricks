# Table layout (liquid clustering) benchmark (run on demand, not part of the pipeline).
# timeout_seconds is a backstop so a runaway query can't use up the daily compute quota.
resources:
  jobs:
    gbdemo_benchmark_layout:
      name: gbdemo_benchmark_layout
      timeout_seconds: 1800
      max_concurrent_runs: 1
      tasks:
        - task_key: benchmark_layout
          max_retries: 0
          environment_key: default
          spark_python_task:
            python_file: ../pipelines/benchmark_layout.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --bronze-schema
              - ${resources.schemas.bronze.name}
              - --silver-schema
              - ${resources.schemas.silver.name}
              - --gold-schema
              - ${resources.schemas.gold.name}
              - --run-id
              - "{{job.run_id}}"
      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - ../dist/*.whl
