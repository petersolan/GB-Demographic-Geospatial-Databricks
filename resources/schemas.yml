# One schema per medallion layer, so access is granted per layer:
#   bronze, silver: no grants (only the owner, i.e. the pipeline identity, can read them)
#   gold:           analysts can read (USE_SCHEMA + SELECT), and read the exports volume
# Within bronze, raw NHS numbers are also hidden by a column mask (pipelines/synthetic_registrations.py).
resources:
  schemas:
    bronze:
      name: gbdemo_bronze
      catalog_name: ${var.catalog}
      comment: Raw landed data, as received. Restricted.
    silver:
      name: gbdemo_silver
      catalog_name: ${var.catalog}
      comment: Cleaned, standardised and geographically enriched records. Restricted.
    gold:
      name: gbdemo_gold
      catalog_name: ${var.catalog}
      comment: Disclosure-controlled aggregates for analysts and publication.
      grants:
        - principal: ${var.analysts_group}
          privileges: [USE_SCHEMA, SELECT]

  volumes:
    landing:
      name: landing
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.bronze.name}
      volume_type: MANAGED
      comment: Files uploaded from local downloads (Free Edition has no general outbound internet).

    checkpoints:
      name: checkpoints
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.bronze.name}
      volume_type: MANAGED
      comment: Stream checkpoints (Auto Loader file tracking, Delta stream offsets). Pipeline only.

    exports:
      name: exports
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.gold.name}
      volume_type: MANAGED
      comment: Protected (disclosure-controlled) files for publication. Nothing record-level.
      grants:
        - principal: ${var.analysts_group}
          privileges: [READ_VOLUME]
