# The pipeline as one job: seven tasks (bronze -> silver -> gold -> publish); silver_spatial and
# the registrations branch run in parallel.
# Every task gets the deployed schema names, so code never hard-codes dev/prod names.
resources:
  jobs:
    gbdemo_pipeline:
      name: gbdemo_pipeline
      max_concurrent_runs: 1
      tasks:
        - task_key: bronze_ingest
          max_retries: 0
          environment_key: default
          spark_python_task:
            python_file: ../pipelines/bronze_ingest.py
            # defined once here (YAML anchor) and reused by the other tasks
            parameters: &layout_args
              - --catalog
              - ${var.catalog}
              - --bronze-schema
              - ${resources.schemas.bronze.name}
              - --silver-schema
              - ${resources.schemas.silver.name}
              - --gold-schema
              - ${resources.schemas.gold.name}
              # filled in by Databricks at run time: every row can be traced to its job run
              - --run-id
              - "{{job.run_id}}"
              - --spatial-scope
              - ${var.spatial_scope}
              - --synthetic-lads
              - ${var.synthetic_lads}

        - task_key: silver_postcodes
          max_retries: 0
          depends_on: [{ task_key: bronze_ingest }]
          environment_key: default
          spark_python_task:
            python_file: ../pipelines/silver_postcodes.py
            parameters: *layout_args

        - task_key: silver_spatial
          max_retries: 0
          depends_on: [{ task_key: silver_postcodes }]
          environment_key: default
          spark_python_task:
            python_file: ../pipelines/silver_spatial.py
            parameters: *layout_args

        - task_key: synthetic_registrations
          max_retries: 0
          depends_on: [{ task_key: silver_postcodes }]
          environment_key: default
          spark_python_task:
            python_file: ../pipelines/synthetic_registrations.py
            parameters: *layout_args

        - task_key: silver_registrations
          max_retries: 0
          depends_on: [{ task_key: synthetic_registrations }]
          environment_key: default
          spark_python_task:
            python_file: ../pipelines/silver_registrations.py
            parameters: *layout_args

        # gold waits for both branches: spatial and registrations run in parallel
        - task_key: gold_aggregate
          max_retries: 0
          depends_on: [{ task_key: silver_spatial }, { task_key: silver_registrations }]
          environment_key: default
          spark_python_task:
            python_file: ../pipelines/gold_aggregate.py
            parameters: *layout_args

        - task_key: publish
          max_retries: 0
          depends_on: [{ task_key: gold_aggregate }]
          environment_key: default
          spark_python_task:
            python_file: ../pipelines/publish.py
            parameters: *layout_args

      # Serverless environment: our wheel (built by the bundle) plus its dependencies
      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - ../dist/*.whl
